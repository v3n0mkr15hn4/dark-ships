# All tunable settings live here. Change a value, rerun `python run.py`.

[data]
day = "2026-04-15"                                  # UTC day
raw_file = "data/raw/ais-2026-04-15.csv.zst"
interim_dir = "data/interim"
out_dir = "out"

[bbox]                                              # Houston–Galveston approaches
lat_min = 28.40
lat_max = 29.90
lon_min = -95.60
lon_max = -93.70
presence_margin_deg = 0.5                           # universe for the coverage grid = bbox ± margin

[clean]
mmsi_min = 201000000                                # ship MMSIs: MID 201-775, 9 digits
mmsi_max = 775999999
mmsi_denylist = []                                  # extra placeholder MMSIs to drop, if any are found

[gaps]
k = 10                                              # gap if silence >= max(gap_min_s, k * expected interval)
gap_min_s = 600
expected_fast_s = 60                                # moving vessel: 1-min floor from NOAA downsampling
expected_slow_s = 180                               # anchored / moored / slow: 3-min nominal rate
class_a_underway_min_kn = 0.5
class_b_moving_min_kn = 2.0

[features]
grid_cells_per_deg = 10                             # presence grid: 0.1 deg cells
bucket_minutes = 10                                 # presence grid: 10-minute UTC buckets
stationary_cells_per_deg = 20                       # 0.05 deg cells for the berth/anchorage test
stationary_max_median_kn = 0.5                      # cell is "stationary" if median SOG below this...
stationary_min_pings = 30                           # ...and it has at least this many pings
teleport_kn = 50                                    # implied speed above this = impossible jump
jump_max_dt_s = 600                                 # consecutive pings closer than this are "non-gap" pairs
mmsi_conflict_jump_rate = 0.05                      # > 5% impossible jumps = two transmitters on one MMSI

# Scoring weights and thresholds. FROZEN before review (git tag weights-frozen): do not tune on labels.
[score]
underway_min_kn = 2.0                               # U = 1 if sog0 >= this and not anchored/moored
quiet_coverage_c = 0.5                              # C floor when nearby water was heard at some time that day
priority_groups = ["tanker", "cargo", "fishing"]
t_class_a_priority = 1.0                            # T for Class A tanker/cargo/fishing
t_class_a_other = 0.6                               # T for other Class A
t_other = 0.3                                       # T for Class B / unknown
port_max_dist_nm = 0.5                              # anchored/moored both ends AND moved less than this
port_max_sog_kn = 0.5                               # or near-zero speed at both ends

[score.weights]
D = 0.35                                            # duration (log of gap / expected interval)
C = 0.30                                            # coverage: others heard where this ship was
U = 0.15                                            # underway when it went silent
K = 0.10                                            # unaccounted time (not explained by straight transit)
T = 0.10                                            # type prior (commercial Class A must transmit)

[score.factors]                                     # suppressors multiply the score
coverage_hole = 0.2                                 # nobody heard near p0/p1 all day
port = 0.2                                          # berth / anchorage / stopped both ends
teleport = 0.3                                      # impossible jump
mmsi_conflict = 0.1                                 # shared or spoofed MMSI

[duckdb]
memory_limit = "1GB"                                # laptop had <1 GB free RAM; DuckDB spills to disk
threads = 4
